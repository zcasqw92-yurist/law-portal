<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Личный кабинет доверителя</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #f8fafc);
      color: var(--tg-theme-text-color, #0f172a);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>
<body class="p-4 pb-20 select-none min-h-screen">

  <!-- ШАПКА -->
  <div class="mb-6">
    <p class="text-xs font-semibold tracking-wider text-slate-400 uppercase">🛡 Личный кабинет доверителя</p>
    <h1 id="user-name" class="text-2xl font-bold mt-1 text-slate-800">Доверитель</h1>
    <div class="mt-2 inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
      <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
      <span id="cases-count">Активных дел: 0</span>
    </div>
  </div>

  <h2 class="text-sm font-bold tracking-wider text-slate-500 uppercase mb-3">📁 Мои дела</h2>

  <!-- СПИСОК ДЕЛ -->
  <div id="cases-list" class="space-y-4">
    <!-- Лоадер при загрузке -->
    <div id="loading" class="text-center py-10 text-slate-400 text-sm">
      Синхронизация с базой данных...
    </div>
  </div>

  <!-- КНОПКА СВЯЗИ С ЮРИСТОМ -->
  <div class="fixed bottom-4 right-4">
    <a id="lawyer-link" href="https://t.me/lawrazbor_bot" target="_blank"
       class="flex items-center space-x-2 bg-slate-900 text-white px-4 py-3 rounded-full shadow-xl font-medium text-sm active:scale-95 transition">
      <span>💬 Написать юристу</span>
    </a>
  </div>

  <script>
    const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxF-P0YpOA6nvHj9Xlm4BD4oNbk8GeU25zvVh550uxH1IViFhKYLAn5Vg9CucOuKVtLPA/exec";
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }

    const tgUser = tg?.initDataUnsafe?.user;
    const userId = tgUser?.id || 173708131; // fallback ID Максима
    const userName = tgUser?.first_name ? `${tgUser.first_name} ${tgUser.last_name || ''}` : "Максим";

    document.getElementById("user-name").innerText = userName;

    // Загрузка дел из Google Таблицы
    async function loadCases() {
      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "GET_CASES",
            user_tg_id: userId,
            initData: tg?.initData || ""
          })
        });

        const data = await response.json();
        if (data.ok && data.cases) {
          renderCases(data.cases);
        } else {
          renderDemoCases();
        }
      } catch (e) {
        console.warn("Используем локальные дела:", e);
        renderDemoCases();
      }
    }

    // Отрисовка дел
    function renderCases(cases) {
      const container = document.getElementById("cases-list");
      container.innerHTML = "";
      document.getElementById("cases-count").innerText = `Активных дел: ${cases.length}`;

      if (cases.length === 0) {
        container.innerHTML = `<div class="bg-white p-6 rounded-2xl border border-slate-200 text-center text-slate-500 text-sm">
          У вас пока нет активных дел в работе.
        </div>`;
        return;
      }

      cases.forEach(c => {
        const startDate = new Date(c.start_date || Date.now());
        const duration = parseInt(c.duration_days) || 10;
        const diffDays = Math.ceil((Date.now() - startDate.getTime()) / (1000 * 3600 * 24));
        const daysLeft = duration - diffDays;
        const isExpired = daysLeft <= 0;
        const progress = Math.min(100, Math.max(0, Math.round((diffDays / duration) * 100)));

        const card = document.createElement("div");
        card.className = "bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4";

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <span class="inline-block px-2.5 py-0.5 rounded-md text-xs font-bold bg-blue-50 text-blue-600">#${c.case_id}</span>
              <p class="text-xs text-slate-400 font-medium mt-1">${c.service_type || 'Досудебная претензия'}</p>
              <h3 class="font-bold text-slate-800 text-base leading-snug mt-0.5">${c.title || 'Ведение спора'}</h3>
            </div>
            ${isExpired ? '<span class="px-2 py-0.5 rounded text-[11px] font-bold bg-red-500 text-white uppercase tracking-wider">Срок истёк</span>' : ''}
          </div>

          <div>
            <div class="flex justify-between text-xs font-semibold mb-1.5">
              <span class="text-slate-400">Срок ответа</span>
              <span class="${isExpired ? 'text-red-500' : 'text-slate-700'}">${isExpired ? 'Срок ответа истёк' : `Осталось ${daysLeft} дн.`}</span>
            </div>
            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-500 ${isExpired ? 'bg-red-500' : 'bg-blue-600'}" style="width: ${progress}%"></div>
            </div>
          </div>

          ${c.docs_link ? `
            <a href="${c.docs_link}" target="_blank" class="flex items-center justify-center space-x-2 w-full py-2.5 bg-slate-50 border border-slate-200 hover:bg-slate-100 rounded-xl text-xs font-semibold text-slate-700 transition active:scale-98">
              <span>📄 Скачать пакет документов</span>
            </a>
          ` : ''}

          ${isExpired ? `
            <div class="bg-amber-50/60 border border-amber-200/80 p-3.5 rounded-xl space-y-2.5">
              <p class="text-xs font-medium text-slate-700 leading-tight">Срок ответа истёк. Выберите дальнейшие действия:</p>
              <div class="grid grid-cols-1 gap-2">
                <button onclick="handleAction('${c.case_id}', 'court_requested')" class="w-full py-2.5 bg-rose-600 active:bg-rose-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                  ⚖️ Передать дело в суд
                </button>
                <button onclick="handleAction('${c.case_id}', 'won')" class="w-full py-2.5 bg-emerald-600 active:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-sm">
                  🟢 Деньги возвращены
                </button>
              </div>
            </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    // Демо-данные для визуализации
    function renderDemoCases() {
      renderCases([
        { case_id: "C-101", service_type: "Досудебная претензия", title: "Возврат средств за некачественный товар — ООО «ТехноСтор»", start_date: new Date(Date.now() - 3*86400000).toISOString(), duration_days: 10, docs_link: "#" },
        { case_id: "C-102", service_type: "Досудебная претензия", title: "Расторжение договора оказания услуг — ИП Морозов", start_date: new Date(Date.now() - 15*86400000).toISOString(), duration_days: 10, docs_link: "#" }
      ]);
    }

    // Обработка клика по конверсионным кнопкам
    async function handleAction(caseId, status) {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      alert(status === 'court_requested' ? "Запрос передан юристу. Мы свяжемся с вами!" : "Поздравляем с успешным завершением дела!");
      
      try {
        await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "UPDATE_STATUS", case_id: caseId, status: status })
        });
      } catch (e) {
        console.error(e);
      }
    }

    loadCases();
  </script>
</body>
</html>
